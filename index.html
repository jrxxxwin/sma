<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mobileStyle.css">
    <title>Salary Tracker</title>
  
</head>
<body>
    <header>
        <img src="logo.png" alt="">
        <div class="tabs">
            <div class="tab active">Dashboard</div>
            <div class="tab" onclick="window.location.href='worklog.html'">Work Log</div>
            <div class="tab" onclick="window.location.href='worklog.html'">Salary Summary</div>
        </div>
        <div class="asdasd">Avatar/Settings</div> <!-- Placeholder for user avatar -->   
    </header>
    <!-- Mobile -->
    <div class="tabsM">
        <div class="tab active">Dashboard</div>
        <div class="tab" onclick="window.location.href='worklog.html'">Work Log</div>
        <div class="tab" onclick="window.location.href='worklog.html'">Salary Summary</div>
    </div>
    <div class="main">
        <div class="asd dsa">
            <label>Date: <input type="date" id="date" required></label>
            <label>In Time: <input type="time" id="inTime" required></label>
            <label>Out Time: <input type="time" id="outTime" required></label>
            <label>Expected Hours: <input type="text" id="hours" required placeholder="e.g., 7hrs"></label>
            <button onclick="addEntry()">Add Entry</button>
        </div>
        
        <div class="payrollSummary">
            <h3>Payroll Summary <span>(<span id="monthContainer"></span>)</span></h3>
            <section>
                <p><img src="https://cdn-icons-png.flaticon.com/128/747/747310.png" alt=""> <span id="totalD">14</span>Total Days</p>
                <p><img src="https://cdn-icons-png.flaticon.com/128/3884/3884295.png" alt=""> <span id="totalH">70</span>Total Hours</p>
                <p><img src="https://cdn-icons-png.flaticon.com/128/4915/4915533.png" alt=""> <span id="totalOT">10</span>Hours OT</p>
            </section>
            <section>
                <div>
                    <h2 id="totalamounts"></h2>
                    <p>Estimated Salary</p>
                </div>
            </section>
        </div>
        <section>
            <table id="workLogTable">
            <thead>
                <tr class="thead">
                    <th>Date</th>
                    <th>In Time</th>
                    <th>Out Time</th>
                    <th>Hours Worked</th>
                    <th>Expected Hours</th>
                    <th>Overtime Hours</th>
                    <th>Value</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="6">Total</th>
                    <th id="totalamount"></th>
                    <th id="btnPrint"><button onclick="printPage()">Print</button></th>
                </tr>
            </tfoot>
        </table>
        </section>
    </div>
</body>
</html>
