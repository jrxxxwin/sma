<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="mobileStyle.css">
    <title>Salary Tracker</title>
  
</head>
<body>
    <header>
        <img src="/logo.png" alt="">
        <div class="tabs">
            <div class="tab" onclick="window.location.href='index.html'">Dashboard</div>
            <div class="tab active">Work Log</div>
            <div class="tab" onclick="window.location.href='worklog.html'">Salary Summary</div>
        </div>
        <div class="asdasd">Avatar/Settings</div> <!-- Placeholder for user avatar -->   
    </header>
    <div class="tabsM">
            <div class="tab" onclick="window.location.href='index.html'">Dashboard</div>
            <div class="tab active">Work Log</div>
            <div class="tab" onclick="window.location.href='worklog.html'">Salary Summary</div>
        </div>
    <div class="main">
        <div class="search-bar">
            <input type="text" placeholder="Search...">
            <button>x</button>
            <div></div>
        </div>
        <div id="collapseTable">
            <div class="TableHeader">
                <p>April</p>
                <button id="dropDown" onclick="collapse()"><img src="/dropArrow.png" alt=""></button>
            </div>
                
            <section>
                <table id="workLogTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>In Time</th>
                        <th>Out Time</th>
                        <th>Hours Worked</th>
                        <th>Expected Hours</th>
                        <th>Overtime Hours</th>
                        <th>Value</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="6">Total</th>
                        <th id="totalamount"></th>
                        <th id="btnPrint"><button onclick="printPage()">Print</button></th>
                    </tr>
                </tfoot>
            </table>
            </section>
        </div>
        
        
        <table id="salarySummaryTable">
            <thead>
                <tr>
                    <th>Period</th>
                    <th>Total Hours</th>
                    <th>Regular Hours</th>
                    <th>Overtime Hours</th>
                    <th>Estimated Salary</th>
                    <th>Breakdown</th>
                </tr>
            </thead>
            <tbody id="pastMonthTable">
            </tbody>
        </table>
    </div>
</body>
</html>
